<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Null Meeting | Meeting</title>


    <!-- =====================================================
         FONT AWESOME
    ====================================================== -->

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    >


    <!-- =====================================================
         GOOGLE FONT
    ====================================================== -->

    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
        rel="stylesheet"
    >


    <style>

        /* =====================================================
           RESET
        ===================================================== */

        * {

            box-sizing: border-box;

            margin: 0;

            padding: 0;

        }


        /* =====================================================
           BODY
        ===================================================== */

        body {

            background:

                radial-gradient(
                    circle at top left,
                    #18264d,
                    transparent 35%
                ),

                radial-gradient(
                    circle at bottom right,
                    #291449,
                    transparent 35%
                ),

                #080b14;

            color: white;

            font-family: "Inter", Arial, sans-serif;

            height: 100vh;

            overflow: hidden;

        }


        /* =====================================================
           TOP BAR
        ===================================================== */

        .top-bar {

            height: 68px;

            background:
                rgba(15, 18, 30, 0.92);

            border-bottom:
                1px solid
                rgba(255,255,255,0.08);

            display: flex;

            align-items: center;

            justify-content: space-between;

            padding: 0 24px;

            backdrop-filter: blur(18px);

            position: relative;

            z-index: 20;

        }


        .logo {

            font-size: 21px;

            font-weight: 800;

            color: #60a5fa;

            white-space: nowrap;

        }


        .meeting-info {

            display: flex;

            align-items: center;

            gap: 8px;

            color: #9ca3af;

            font-size: 13px;

        }


        #meetingId {

            color: white;

            font-weight: 700;

            letter-spacing: 1px;

        }


        .participant-count {

            background:
                rgba(96,165,250,0.12);

            border:
                1px solid
                rgba(96,165,250,0.2);

            color: #93c5fd;

            padding:
                7px 12px;

            border-radius: 20px;

            font-size: 12px;

            white-space: nowrap;

        }


        /* =====================================================
           VIDEO AREA
        ===================================================== */

        .video-area {

            height:
                calc(100vh - 148px);

            padding: 18px;

            overflow: auto;

        }


        .video-grid {

            width: 100%;

            max-width: 1500px;

            min-height: 100%;

            margin: auto;

            display: grid;

            grid-template-columns:
                repeat(
                    auto-fit,
                    minmax(
                        300px,
                        1fr
                    )
                );

            gap: 16px;

        }


        /* =====================================================
           VIDEO CARD
        ===================================================== */

        .video-card {

            position: relative;

            background:
                linear-gradient(
                    145deg,
                    #171c2b,
                    #0d111c
                );

            border:
                1px solid
                rgba(255,255,255,0.08);

            border-radius: 20px;

            overflow: hidden;

            min-height: 250px;

            display: flex;

            align-items: center;

            justify-content: center;

            box-shadow:
                0 15px 40px
                rgba(0,0,0,0.25);

        }


        .video-card video {

            width: 100%;

            height: 100%;

            object-fit: cover;

            display: none;

        }


        .local-video {

            transform: scaleX(-1);

        }


        /* =====================================================
           CAMERA OFF
        ====================================================== */

        .camera-off {

            text-align: center;

            color: #9ca3af;

        }


        .avatar {

            width: 82px;

            height: 82px;

            border-radius: 50%;

            display: flex;

            align-items: center;

            justify-content: center;

            margin: 0 auto 14px;

            background:
                linear-gradient(
                    135deg,
                    #2563eb,
                    #7c3aed
                );

            font-size: 30px;

            font-weight: 800;

            color: white;

        }


        .user-name {

            font-size: 17px;

            font-weight: 700;

            color: white;

            margin-bottom: 5px;

        }


        .camera-text {

            font-size: 13px;

            color: #8b93a5;

        }


        /* =====================================================
           VIDEO LABEL
        ====================================================== */

        .video-label {

            position: absolute;

            left: 14px;

            bottom: 14px;

            background:
                rgba(0,0,0,0.65);

            padding:
                7px 11px;

            border-radius: 8px;

            font-size: 13px;

            backdrop-filter: blur(8px);

            z-index: 5;

        }


        /* =====================================================
           CONNECTION STATUS
        ====================================================== */

        .connection-status {

            position: absolute;

            top: 14px;

            right: 14px;

            background:
                rgba(0,0,0,0.6);

            padding:
                7px 10px;

            border-radius: 8px;

            font-size: 12px;

            color: #fbbf24;

            z-index: 5;

        }


        .connection-status.connected {

            color: #4ade80;

        }


        /* =====================================================
           CONTROLS
        ====================================================== */

        .controls {

            height: 80px;

            background:
                rgba(12,15,24,0.94);

            border-top:
                1px solid
                rgba(255,255,255,0.08);

            display: flex;

            justify-content: center;

            align-items: center;

            gap: 14px;

            backdrop-filter: blur(18px);

            position: relative;

            z-index: 30;

        }


        .control-btn {

            width: 52px;

            height: 52px;

            border-radius: 50%;

            border: none;

            background:
                #242a38;

            color: white;

            font-size: 18px;

            cursor: pointer;

            transition: 0.2s ease;

            position: relative;

        }


        .control-btn:hover {

            transform:
                translateY(-2px);

            background:
                #343b4c;

        }


        .control-btn.active {

            background:
                #2563eb;

        }


        .leave-btn {

            background:
                #dc2626;

            margin-left: 12px;

        }


        .leave-btn:hover {

            background:
                #ef4444;

        }


        /* =====================================================
           CHAT BUTTON BADGE
        ====================================================== */

        .chat-badge {

            position: absolute;

            top: -3px;

            right: -3px;

            width: 18px;

            height: 18px;

            border-radius: 50%;

            background: #ef4444;

            color: white;

            font-size: 10px;

            display: none;

            align-items: center;

            justify-content: center;

            font-weight: 700;

        }


        .chat-badge.show {

            display: flex;

        }


        /* =====================================================
           CHAT PANEL
        ====================================================== */

        .chat-panel {

            position: fixed;

            top: 78px;

            right: 18px;

            width: 350px;

            height:
                calc(100vh - 178px);

            max-height: 650px;

            background:
                rgba(14,18,30,0.97);

            border:
                1px solid
                rgba(255,255,255,0.1);

            border-radius: 18px;

            box-shadow:
                0 25px 70px
                rgba(0,0,0,0.5);

            backdrop-filter: blur(20px);

            z-index: 50;

            display: none;

            flex-direction: column;

            overflow: hidden;

        }


        .chat-panel.open {

            display: flex;

        }


        /* =====================================================
           CHAT HEADER
        ====================================================== */

        .chat-header {

            height: 60px;

            display: flex;

            align-items: center;

            justify-content: space-between;

            padding: 0 18px;

            border-bottom:
                1px solid
                rgba(255,255,255,0.08);

        }


        .chat-title {

            display: flex;

            align-items: center;

            gap: 10px;

            font-size: 16px;

            font-weight: 700;

        }


        .chat-title i {

            color: #60a5fa;

        }


        .close-chat {

            border: none;

            background: transparent;

            color: #9ca3af;

            font-size: 18px;

            cursor: pointer;

            width: 34px;

            height: 34px;

            border-radius: 8px;

        }


        .close-chat:hover {

            background:
                rgba(255,255,255,0.08);

            color: white;

        }


        /* =====================================================
           CHAT MESSAGES
        ====================================================== */

        .chat-messages {

            flex: 1;

            overflow-y: auto;

            padding: 16px;

        }


        .empty-chat {

            height: 100%;

            display: flex;

            align-items: center;

            justify-content: center;

            flex-direction: column;

            gap: 10px;

            color: #71798b;

            text-align: center;

            font-size: 13px;

        }


        .empty-chat i {

            font-size: 35px;

            color: #39445c;

        }


        .message {

            display: flex;

            flex-direction: column;

            margin-bottom: 14px;

            max-width: 85%;

        }


        .message.mine {

            margin-left: auto;

            align-items: flex-end;

        }


        .message.other {

            margin-right: auto;

            align-items: flex-start;

        }


        .message-sender {

            font-size: 11px;

            color: #8e98ac;

            margin-bottom: 4px;

        }


        .message-bubble {

            padding:
                9px 12px;

            border-radius: 13px;

            font-size: 13px;

            line-height: 1.45;

            word-break: break-word;

        }


        .message.mine .message-bubble {

            background:
                #2563eb;

            color: white;

            border-bottom-right-radius: 4px;

        }


        .message.other .message-bubble {

            background:
                #242a38;

            color: #e5e7eb;

            border-bottom-left-radius: 4px;

        }


        .message-time {

            font-size: 9px;

            color: #626b7d;

            margin-top: 4px;

        }


        /* =====================================================
           CHAT INPUT
        ====================================================== */

        .chat-input-area {

            padding: 12px;

            border-top:
                1px solid
                rgba(255,255,255,0.08);

            display: flex;

            gap: 8px;

        }


        #chatInput {

            flex: 1;

            height: 42px;

            border: none;

            outline: none;

            border-radius: 10px;

            background:
                #202634;

            color: white;

            padding:
                0 12px;

            font-size: 13px;

        }


        #chatInput::placeholder {

            color: #687184;

        }


        #sendChatBtn {

            width: 42px;

            height: 42px;

            border: none;

            border-radius: 10px;

            background:
                #2563eb;

            color: white;

            cursor: pointer;

            font-size: 15px;

        }


        #sendChatBtn:hover {

            background:
                #3b82f6;

        }


        /* =====================================================
           TOAST
        ====================================================== */

        #toast {

            position: fixed;

            left: 50%;

            bottom: 100px;

            transform:
                translateX(-50%)
                translateY(20px);

            background:
                rgba(20,25,38,0.96);

            border:
                1px solid
                rgba(255,255,255,0.1);

            padding:
                12px 18px;

            border-radius: 12px;

            opacity: 0;

            pointer-events: none;

            transition: 0.25s ease;

            z-index: 100;

            color: #e5e7eb;

            font-size: 13px;

        }


        #toast.show {

            opacity: 1;

            transform:
                translateX(-50%)
                translateY(0);

        }


        /* =====================================================
           MOBILE
        ====================================================== */

        @media (max-width: 700px) {

            .top-bar {

                padding: 0 12px;

            }


            .logo {

                font-size: 17px;

            }


            .meeting-info {

                font-size: 10px;

            }


            #meetingId {

                font-size: 10px;

            }


            .participant-count {

                display: none;

            }


            .video-area {

                padding: 10px;

            }


            .video-grid {

                grid-template-columns: 1fr;

            }


            .video-card {

                min-height: 230px;

            }


            .controls {

                gap: 7px;

            }


            .control-btn {

                width: 46px;

                height: 46px;

                font-size: 16px;

            }


            .leave-btn {

                margin-left: 5px;

            }


            .chat-panel {

                top: 74px;

                left: 10px;

                right: 10px;

                width: auto;

                height:
                    calc(100vh - 160px);

            }

        }

    </style>

</head>


<body>


<!-- =====================================================
     TOP BAR
====================================================== -->

<header class="top-bar">

    <div class="logo">

        <i class="fa-solid fa-video"></i>

        NULL MEETING

    </div>


    <div class="meeting-info">

        <span>Meeting ID:</span>

        <span id="meetingId">

            Loading...

        </span>

    </div>


    <div
        class="participant-count"
        id="participantCount"
    >

        👥 1 participant

    </div>

</header>



<!-- =====================================================
     VIDEO AREA
====================================================== -->

<main class="video-area">

    <div
        class="video-grid"
        id="videoGrid"
    >

    </div>

</main>



<!-- =====================================================
     CONTROLS
====================================================== -->

<div class="controls">


    <!-- CAMERA -->

    <button
        class="control-btn"
        id="cameraBtn"
        onclick="toggleCamera()"
        title="Camera"
    >

        <i class="fa-solid fa-video"></i>

    </button>


    <!-- MICROPHONE -->

    <button
        class="control-btn"
        id="micBtn"
        onclick="toggleMicrophone()"
        title="Microphone"
    >

        <i class="fa-solid fa-microphone"></i>

    </button>


    <!-- SCREEN SHARE -->

    <button
        class="control-btn"
        id="screenBtn"
        onclick="shareScreen()"
        title="Share screen"
    >

        <i class="fa-solid fa-display"></i>

    </button>


    <!-- CHAT -->

    <button
        class="control-btn"
        id="chatBtn"
        onclick="toggleChat()"
        title="Chat"
    >

        <i class="fa-solid fa-comment"></i>

        <span
            class="chat-badge"
            id="chatBadge"
        >
            0
        </span>

    </button>


    <!-- LEAVE -->

    <button
        class="control-btn leave-btn"
        onclick="leaveMeeting()"
        title="Leave meeting"
    >

        <i class="fa-solid fa-phone"></i>

    </button>

</div>



<!-- =====================================================
     CHAT PANEL
====================================================== -->

<aside
    class="chat-panel"
    id="chatPanel"
>


    <div class="chat-header">

        <div class="chat-title">

            <i class="fa-solid fa-comments"></i>

            Meeting Chat

        </div>


        <button
            class="close-chat"
            onclick="toggleChat()"
        >

            <i class="fa-solid fa-xmark"></i>

        </button>

    </div>


    <div
        class="chat-messages"
        id="chatMessages"
    >

        <div
            class="empty-chat"
            id="emptyChat"
        >

            <i class="fa-regular fa-comments"></i>

            <span>
                No messages yet
            </span>

            <small>
                Start the conversation 👋
            </small>

        </div>

    </div>


    <div class="chat-input-area">

        <input
            type="text"
            id="chatInput"
            placeholder="Type a message..."
            maxlength="500"
            autocomplete="off"
        >


        <button
            id="sendChatBtn"
            onclick="sendChatMessage()"
        >

            <i class="fa-solid fa-paper-plane"></i>

        </button>

    </div>

</aside>



<!-- =====================================================
     TOAST
====================================================== -->

<div id="toast"></div>



<script>

/* =========================================================
   CONFIGURATION
========================================================= */

const API_URL =
    "https://null-meeting.onrender.com";


/* =========================================================
   GET MEETING ID
========================================================= */

const urlParams =
    new URLSearchParams(
        window.location.search
    );


const meetingId =
    urlParams.get("meeting_id");


if (!meetingId) {

    alert(
        "Meeting ID not found."
    );

    window.location.href =
        "dashboard.html";

}


/* =========================================================
   SHOW MEETING ID
========================================================= */

document.getElementById(
    "meetingId"
).innerText =
    meetingId;


/* =========================================================
   GET CURRENT USER
========================================================= */

let currentUser = null;


try {

    const savedUser =
        localStorage.getItem("user");


    if (savedUser) {

        currentUser =
            JSON.parse(savedUser);

    }

}
catch (error) {

    console.error(
        "User data error:",
        error
    );

}


const localUserName =
    currentUser?.name ||
    "You";


/* =========================================================
   TOKEN
========================================================= */

const token =
    localStorage.getItem(
        "access_token"
    );


if (!token) {

    alert(
        "Please login first."
    );

    window.location.href =
        "index.html";

}


/* =========================================================
   WEBRTC VARIABLES
========================================================= */

let localStream = null;

let websocket = null;

let localParticipantId = null;

let cameraEnabled = false;

let microphoneEnabled = false;

let screenSharing = false;


/* =========================================================
   PEER CONNECTIONS
========================================================= */

const peerConnections = {};


/* =========================================================
   REMOTE STREAMS
========================================================= */

const remoteStreams = {};


/* =========================================================
   RTC CONFIGURATION
========================================================= */

const rtcConfiguration = {

    iceServers: [

        {
            urls:
                "stun:stun.l.google.com:19302"
        },

        {
            urls:
                "stun:stun1.l.google.com:19302"
        }

    ]

};


/* =========================================================
   CHAT VARIABLES
========================================================= */

let unreadMessages = 0;


/* =========================================================
   TOAST
========================================================= */

function showToast(message) {

    const toast =
        document.getElementById(
            "toast"
        );


    toast.innerText =
        message;


    toast.classList.add(
        "show"
    );


    setTimeout(
        () => {

            toast.classList.remove(
                "show"
            );

        },
        2500
    );

}


/* =========================================================
   PARTICIPANT COUNT
========================================================= */

function updateParticipantCount(
    count
) {

    const element =
        document.getElementById(
            "participantCount"
        );


    element.innerText =
        `👥 ${count} participant${
            count === 1 ? "" : "s"
        }`;

}


/* =========================================================
   LOCAL VIDEO CARD
========================================================= */

function createLocalCard() {

    const grid =
        document.getElementById(
            "videoGrid"
        );


    if (
        document.getElementById(
            "local-card"
        )
    ) {

        return;

    }


    const card =
        document.createElement(
            "div"
        );


    card.className =
        "video-card";


    card.id =
        "local-card";


    card.innerHTML = `

        <video
            id="localVideo"
            class="local-video"
            autoplay
            muted
            playsinline
        ></video>


        <div
            class="camera-off"
            id="localCameraOff"
        >

            <div class="avatar">

                ${
                    localUserName
                        .charAt(0)
                        .toUpperCase()
                }

            </div>


            <div class="user-name">

                ${escapeHTML(localUserName)}

            </div>


            <div class="camera-text">

                Camera is off

            </div>

        </div>


        <div class="video-label">

            ${escapeHTML(localUserName)} (You)

        </div>

    `;


    grid.appendChild(
        card
    );

}


/* =========================================================
   REMOTE VIDEO CARD
========================================================= */

function createRemoteCard(
    participantId
) {

    const existing =
        document.getElementById(
            `remote-${participantId}`
        );


    if (existing) {

        return existing;

    }


    const grid =
        document.getElementById(
            "videoGrid"
        );


    const card =
        document.createElement(
            "div"
        );


    card.className =
        "video-card";


    card.id =
        `remote-${participantId}`;


    card.innerHTML = `

        <video
            id="video-${participantId}"
            autoplay
            playsinline
        ></video>


        <div
            class="camera-off"
            id="placeholder-${participantId}"
        >

            <div class="avatar">

                <i class="fa-solid fa-user"></i>

            </div>


            <div class="user-name">

                Participant

            </div>


            <div class="camera-text">

                Camera is off

            </div>

        </div>


        <div class="video-label">

            Participant

        </div>


        <div
            class="connection-status"
            id="status-${participantId}"
        >

            Connecting...

        </div>

    `;


    grid.appendChild(
        card
    );


    return card;

}


/* =========================================================
   REMOVE REMOTE CARD
========================================================= */

function removeRemoteCard(
    participantId
) {

    const card =
        document.getElementById(
            `remote-${participantId}`
        );


    if (card) {

        card.remove();

    }

}


/* =========================================================
   REMOTE STATUS
========================================================= */

function setRemoteStatus(
    participantId,
    text,
    connected = false
) {

    const status =
        document.getElementById(
            `status-${participantId}`
        );


    if (!status) {

        return;

    }


    status.innerText =
        text;


    if (connected) {

        status.classList.add(
            "connected"
        );

    }
    else {

        status.classList.remove(
            "connected"
        );

    }

}


/* =========================================================
   CREATE PEER CONNECTION
========================================================= */

function createPeerConnection(
    participantId
) {

    console.log(
        "Creating peer connection:",
        participantId
    );


    if (
        peerConnections[
            participantId
        ]
    ) {

        return peerConnections[
            participantId
        ];

    }


    createRemoteCard(
        participantId
    );


    const peerConnection =
        new RTCPeerConnection(
            rtcConfiguration
        );


    peerConnections[
        participantId
    ] =
        peerConnection;


    const remoteStream =
        new MediaStream();


    remoteStreams[
        participantId
    ] =
        remoteStream;


    const remoteVideo =
        document.getElementById(
            `video-${participantId}`
        );


    remoteVideo.srcObject =
        remoteStream;


    /* -----------------------------------------------------
       ADD LOCAL TRACKS
    ----------------------------------------------------- */

    if (localStream) {

        localStream
            .getTracks()
            .forEach(
                track => {

                    peerConnection.addTrack(
                        track,
                        localStream
                    );

                }
            );

    }


    /* -----------------------------------------------------
       RECEIVE REMOTE TRACKS
    ----------------------------------------------------- */

    peerConnection.ontrack =
        function(event) {

            console.log(
                "Remote track received:",
                participantId
            );


            const streams =
                event.streams;


            if (streams.length > 0) {

                streams[0]
                    .getTracks()
                    .forEach(
                        track => {

                            const exists =
                                remoteStream
                                    .getTracks()
                                    .some(
                                        existingTrack =>
                                            existingTrack.id ===
                                            track.id
                                    );


                            if (!exists) {

                                remoteStream.addTrack(
                                    track
                                );

                            }

                        }
                    );

            }
            else {

                remoteStream.addTrack(
                    event.track
                );

            }


            remoteVideo.style.display =
                "block";


            const placeholder =
                document.getElementById(
                    `placeholder-${participantId}`
                );


            if (placeholder) {

                placeholder.style.display =
                    "none";

            }


            setRemoteStatus(
                participantId,
                "Connected",
                true
            );

        };


    /* -----------------------------------------------------
       ICE
    ----------------------------------------------------- */

    peerConnection.onicecandidate =
        function(event) {

            if (
                event.candidate &&
                websocket &&
                websocket.readyState ===
                    WebSocket.OPEN
            ) {

                websocket.send(
                    JSON.stringify({

                        type:
                            "ice-candidate",

                        target_id:
                            participantId,

                        candidate:
                            event.candidate

                    })
                );

            }

        };


    /* -----------------------------------------------------
       CONNECTION STATE
    ----------------------------------------------------- */

    peerConnection.onconnectionstatechange =
        function() {

            console.log(
                "Connection:",
                participantId,
                peerConnection.connectionState
            );


            if (
                peerConnection.connectionState ===
                "connected"
            ) {

                setRemoteStatus(
                    participantId,
                    "Connected",
                    true
                );

            }


            if (
                peerConnection.connectionState ===
                "connecting"
            ) {

                setRemoteStatus(
                    participantId,
                    "Connecting..."
                );

            }


            if (
                peerConnection.connectionState ===
                "disconnected"
            ) {

                setRemoteStatus(
                    participantId,
                    "Disconnected"
                );

            }


            if (
                peerConnection.connectionState ===
                "failed"
            ) {

                setRemoteStatus(
                    participantId,
                    "Connection failed"
                );

            }

        };


    return peerConnection;

}


/* =========================================================
   CREATE OFFER
========================================================= */

async function createOfferForParticipant(
    participantId
) {

    try {

        const peerConnection =
            createPeerConnection(
                participantId
            );


        const offer =
            await peerConnection.createOffer();


        await peerConnection.setLocalDescription(
            offer
        );


        if (
            websocket &&
            websocket.readyState ===
                WebSocket.OPEN
        ) {

            websocket.send(
                JSON.stringify({

                    type:
                        "offer",

                    target_id:
                        participantId,

                    offer:
                        offer

                })
            );

        }


        console.log(
            "Offer sent:",
            participantId
        );

    }
    catch (error) {

        console.error(
            "Create offer error:",
            error
        );

    }

}


/* =========================================================
   HANDLE OFFER
========================================================= */

async function handleOffer(
    senderId,
    offer
) {

    try {

        console.log(
            "Offer received:",
            senderId
        );


        const peerConnection =
            createPeerConnection(
                senderId
            );


        await peerConnection.setRemoteDescription(
            new RTCSessionDescription(
                offer
            )
        );


        const answer =
            await peerConnection.createAnswer();


        await peerConnection.setLocalDescription(
            answer
        );


        if (
            websocket &&
            websocket.readyState ===
                WebSocket.OPEN
        ) {

            websocket.send(
                JSON.stringify({

                    type:
                        "answer",

                    target_id:
                        senderId,

                    answer:
                        answer

                })
            );

        }


        console.log(
            "Answer sent:",
            senderId
        );

    }
    catch (error) {

        console.error(
            "Handle offer error:",
            error
        );

    }

}


/* =========================================================
   HANDLE ANSWER
========================================================= */

async function handleAnswer(
    senderId,
    answer
) {

    try {

        const peerConnection =
            peerConnections[
                senderId
            ];


        if (!peerConnection) {

            console.warn(
                "Peer connection not found:",
                senderId
            );

            return;

        }


        await peerConnection.setRemoteDescription(
            new RTCSessionDescription(
                answer
            )
        );


        console.log(
            "Answer accepted:",
            senderId
        );

    }
    catch (error) {

        console.error(
            "Handle answer error:",
            error
        );

    }

}


/* =========================================================
   HANDLE ICE
========================================================= */

async function handleIceCandidate(
    senderId,
    candidate
) {

    try {

        const peerConnection =
            peerConnections[
                senderId
            ];


        if (!peerConnection) {

            return;

        }


        await peerConnection.addIceCandidate(
            new RTCIceCandidate(
                candidate
            )
        );


    }
    catch (error) {

        console.error(
            "ICE error:",
            error
        );

    }

}


/* =========================================================
   CONNECT WEBSOCKET
========================================================= */

function connectWebSocket() {

    const websocketProtocol =
        API_URL.startsWith("https://")
            ? "wss:"
            : "ws:";

    const websocketHost =
        API_URL.replace(/^https?:\/\//, "");

    const websocketURL =
        `${websocketProtocol}//${websocketHost}/ws/${
            encodeURIComponent(meetingId)
        }`;


    console.log(
        "Connecting:",
        websocketURL
    );


    websocket =
        new WebSocket(
            websocketURL
        );


    /* -----------------------------------------------------
       OPEN
    ----------------------------------------------------- */

    websocket.onopen =
        function() {

            console.log(
                "WebSocket connected."
            );


            showToast(
                "Connected to meeting 🟢"
            );

        };


    /* -----------------------------------------------------
       MESSAGE
    ----------------------------------------------------- */

    websocket.onmessage =
        async function(event) {

            try {

                const message =
                    JSON.parse(
                        event.data
                    );


                console.log(
                    "Received:",
                    message
                );


                /* =========================================
                   ROOM INFO
                ========================================= */

                if (
                    message.type ===
                    "room_info"
                ) {

                    localParticipantId =
                        message.participant_id;


                    updateParticipantCount(
                        message.participants
                    );


                    if (
                        message.existing_participants
                    ) {

                        for (
                            const participantId
                            of message.existing_participants
                        ) {

                            createPeerConnection(
                                participantId
                            );


                            setTimeout(
                                () => {

                                    createOfferForParticipant(
                                        participantId
                                    );

                                },
                                500
                            );

                        }

                    }

                }


                /* =========================================
                   USER JOINED
                ========================================= */

                else if (
                    message.type ===
                    "user_joined"
                ) {

                    const participantId =
                        message.participant_id;


                    updateParticipantCount(
                        message.participants
                    );


                    showToast(
                        "Someone joined the meeting 👋"
                    );


                    if (participantId) {

                        createRemoteCard(
                            participantId
                        );

                    }

                }


                /* =========================================
                   OFFER
                ========================================= */

                else if (
                    message.type ===
                    "offer"
                ) {

                    await handleOffer(
                        message.sender_id,
                        message.offer
                    );

                }


                /* =========================================
                   ANSWER
                ========================================= */

                else if (
                    message.type ===
                    "answer"
                ) {

                    await handleAnswer(
                        message.sender_id,
                        message.answer
                    );

                }


                /* =========================================
                   ICE
                ========================================= */

                else if (
                    message.type ===
                    "ice-candidate"
                ) {

                    await handleIceCandidate(
                        message.sender_id,
                        message.candidate
                    );

                }


                /* =========================================
                   USER LEFT
                ========================================= */

                else if (
                    message.type ===
                    "user_left"
                ) {

                    const participantId =
                        message.participant_id;


                    updateParticipantCount(
                        message.participants
                    );


                    showToast(
                        "Participant left the meeting."
                    );


                    if (
                        participantId &&
                        peerConnections[
                            participantId
                        ]
                    ) {

                        peerConnections[
                            participantId
                        ].close();


                        delete peerConnections[
                            participantId
                        ];

                    }


                    if (participantId) {

                        delete remoteStreams[
                            participantId
                        ];


                        removeRemoteCard(
                            participantId
                        );

                    }

                }


                /* =========================================
                   CHAT MESSAGE
                ========================================= */

                else if (
                    message.type ===
                    "chat"
                ) {

                    /*
                     * Ignore our own message if the backend
                     * ever sends it back.
                     */

                    if (
                        message.sender_id &&
                        localParticipantId &&
                        message.sender_id ===
                            localParticipantId
                    ) {

                        return;

                    }


                    addChatMessage(

                        message.sender_name ||
                        "Participant",

                        message.text ||
                        "",

                        false

                    );


                    /*
                     * Show notification only when
                     * chat panel is closed.
                     */

                    const chatPanel =
                        document.getElementById(
                            "chatPanel"
                        );


                    if (
                        !chatPanel.classList.contains(
                            "open"
                        )
                    ) {

                        unreadMessages++;

                        updateChatBadge();

                        showToast(
                            `New message from ${
                                message.sender_name ||
                                "Participant"
                            } 💬`
                        );

                    }

                }

            }
            catch (error) {

                console.error(
                    "WebSocket message error:",
                    error
                );

            }

        };


    /* -----------------------------------------------------
       ERROR
    ----------------------------------------------------- */

    websocket.onerror =
        function(error) {

            console.error(
                "WebSocket error:",
                error
            );


            showToast(
                "WebSocket connection error."
            );

        };


    /* -----------------------------------------------------
       CLOSE
    ----------------------------------------------------- */

    websocket.onclose =
        function() {

            console.log(
                "WebSocket closed."
            );

        };

}


/* =========================================================
   START LOCAL MEDIA
========================================================= */

async function startLocalMedia(
    video = false,
    audio = false
) {

    try {

        const stream =
            await navigator.mediaDevices
                .getUserMedia({

                    video:
                        video,

                    audio:
                        audio

                });


        if (!localStream) {

            localStream =
                new MediaStream();

        }


        stream
            .getTracks()
            .forEach(
                track => {

                    localStream.addTrack(
                        track
                    );

                }
            );


        const localVideo =
            document.getElementById(
                "localVideo"
            );


        localVideo.srcObject =
            localStream;


        /*
         * Add new tracks to existing
         * peer connections.
         */

        Object.values(
            peerConnections
        ).forEach(
            peerConnection => {

                stream
                    .getTracks()
                    .forEach(
                        track => {

                            const exists =
                                peerConnection
                                    .getSenders()
                                    .some(
                                        sender =>
                                            sender.track ===
                                            track
                                    );


                            if (!exists) {

                                peerConnection.addTrack(
                                    track,
                                    localStream
                                );

                            }

                        }
                    );

            }
        );


        return true;

    }
    catch (error) {

        console.error(
            "Media error:",
            error
        );


        return false;

    }

}


/* =========================================================
   CAMERA
========================================================= */

async function toggleCamera() {

    if (!cameraEnabled) {

        const success =
            await startLocalMedia(
                true,
                false
            );


        if (!success) {

            alert(
                "Camera permission was denied or camera is unavailable."
            );

            return;

        }


        localStream
            .getVideoTracks()
            .forEach(
                track => {

                    track.enabled =
                        true;

                }
            );


        document.getElementById(
            "localVideo"
        ).style.display =
            "block";


        document.getElementById(
            "localCameraOff"
        ).style.display =
            "none";


        cameraEnabled =
            true;


        document.getElementById(
            "cameraBtn"
        ).classList.add(
            "active"
        );


        showToast(
            "Camera turned on 🎥"
        );


        /*
         * Renegotiate.
         */

        for (
            const participantId
            of Object.keys(
                peerConnections
            )
        ) {

            await createOfferForParticipant(
                participantId
            );

        }

    }
    else {

        if (localStream) {

            localStream
                .getVideoTracks()
                .forEach(
                    track => {

                        track.enabled =
                            false;

                    }
                );

        }


        document.getElementById(
            "localVideo"
        ).style.display =
            "none";


        document.getElementById(
            "localCameraOff"
        ).style.display =
            "block";


        cameraEnabled =
            false;


        document.getElementById(
            "cameraBtn"
        ).classList.remove(
            "active"
        );


        showToast(
            "Camera turned off"
        );

    }

}

   MICROPHONE

/* =========================================================
   SCREEN SHARE
========================================================= */

async function shareScreen() {

    try {

        const screenStream =
            await navigator.mediaDevices
                .getDisplayMedia({

                    video: true

                });


        const screenTrack =
            screenStream
                .getVideoTracks()[0];


        const localVideo =
            document.getElementById(
                "localVideo"
            );


        localVideo.srcObject =
            screenStream;


        localVideo.style.display =
            "block";


        document.getElementById(
            "localCameraOff"
        ).style.display =
            "none";


        screenSharing =
            true;


        document.getElementById(
            "screenBtn"
        ).classList.add(
            "active"
        );


        /*
         * Replace video track.
         */

        for (
            const peerConnection
            of Object.values(
                peerConnections
            )
        ) {

            const sender =
                peerConnection
                    .getSenders()
                    .find(
                        sender =>
                            sender.track &&
                            sender.track.kind ===
                            "video"
                    );


            if (sender) {

                await sender.replaceTrack(
                    screenTrack
                );

            }
            else {

                peerConnection.addTrack(
                    screenTrack
                );

            }

        }


        showToast(
            "Screen sharing started 🖥️"
        );


        /* -------------------------------------------------
           SCREEN SHARE STOPPED
        ------------------------------------------------- */

        screenTrack.onended =
            async function() {

                screenSharing =
                    false;


                document.getElementById(
                    "screenBtn"
                ).classList.remove(
                    "active"
                );


                if (
                    cameraEnabled &&
                    localStream
                ) {

                    const cameraTrack =
                        localStream
                            .getVideoTracks()[0];


                    if (cameraTrack) {

                        for (
                            const peerConnection
                            of Object.values(
                                peerConnections
                            )
                        ) {

                            const sender =
                                peerConnection
                                    .getSenders()
                                    .find(
                                        sender =>
                                            sender.track &&
                                            sender.track.kind ===
                                            "video"
                                    );


                            if (sender) {

                                await sender.replaceTrack(
                                    cameraTrack
                                );

                            }

                        }


                        localVideo.srcObject =
                            localStream;


                        localVideo.style.display =
                            "block";


                        document.getElementById(
                            "localCameraOff"
                        ).style.display =
                            "none";

                    }

                }
                else {

                    localVideo.style.display =
                        "none";


                    document.getElementById(
                        "localCameraOff"
                    ).style.display =
                        "block";

                }


                showToast(
                    "Screen sharing stopped"
                );

            };

    }
    catch (error) {

        console.log(
            "Screen sharing cancelled."
        );

    }

}


/* =========================================================
   CHAT
========================================================= */

function toggleChat() {

    const chatPanel =
        document.getElementById(
            "chatPanel"
        );


    chatPanel.classList.toggle(
        "open"
    );


    /*
     * When opening chat, clear notification.
     */

    if (
        chatPanel.classList.contains(
            "open"
        )
    ) {

        unreadMessages = 0;

        updateChatBadge();


        setTimeout(
            () => {

                document.getElementById(
                    "chatInput"
                ).focus();

            },
            100
        );

    }

}


/* =========================================================
   SEND CHAT MESSAGE
========================================================= */

function sendChatMessage() {

    const input =
        document.getElementById(
            "chatInput"
        );


    const text =
        input.value.trim();


    if (!text) {

        return;

    }


    if (
        !websocket ||
        websocket.readyState !==
            WebSocket.OPEN
    ) {

        showToast(
            "Chat is not connected."
        );

        return;

    }


    const message = {

        type:
            "chat",

        sender_id:
            localParticipantId,

        sender_name:
            localUserName,

        text:
            text

    };


    /*
     * Show our own message immediately.
     */

    addChatMessage(
        localUserName,
        text,
        true
    );


    /*
     * Send through WebSocket.
     */

    websocket.send(
        JSON.stringify(
            message
        )
    );


    input.value =
        "";

}


/* =========================================================
   ADD CHAT MESSAGE
========================================================= */

function addChatMessage(
    senderName,
    text,
    isMine
) {

    const messages =
        document.getElementById(
            "chatMessages"
        );


    const emptyChat =
        document.getElementById(
            "emptyChat"
        );


    if (emptyChat) {

        emptyChat.remove();

    }


    const message =
        document.createElement(
            "div"
        );


    message.className =
        `message ${
            isMine
                ? "mine"
                : "other"
        }`;


    const sender =
        document.createElement(
            "div"
        );


    sender.className =
        "message-sender";


    sender.innerText =
        isMine
            ? "You"
            : senderName;


    const bubble =
        document.createElement(
            "div"
        );


    bubble.className =
        "message-bubble";


    /*
     * Use textContent instead of innerHTML
     * so user messages cannot inject HTML.
     */

    bubble.textContent =
        text;


    const time =
        document.createElement(
            "div"
        );


    time.className =
        "message-time";


    time.innerText =
        getCurrentTime();


    message.appendChild(
        sender
    );


    message.appendChild(
        bubble
    );


    message.appendChild(
        time
    );


    messages.appendChild(
        message
    );


    /*
     * Scroll to newest message.
     */

    messages.scrollTop =
        messages.scrollHeight;

}


/* =========================================================
   CHAT BADGE
========================================================= */

function updateChatBadge() {

    const badge =
        document.getElementById(
            "chatBadge"
        );


    if (
        unreadMessages <= 0
    ) {

        badge.classList.remove(
            "show"
        );

        return;

    }


    badge.innerText =
        unreadMessages > 9
            ? "9+"
            : unreadMessages;


    badge.classList.add(
        "show"
    );

}


/* =========================================================
   CURRENT TIME
========================================================= */

function getCurrentTime() {

    return new Date().toLocaleTimeString(
        [],
        {
            hour: "2-digit",
            minute: "2-digit"
        }
    );

}


/* =========================================================
   ENTER TO SEND
========================================================= */

document.getElementById(
    "chatInput"
).addEventListener(
    "keydown",
    function(event) {

        if (
            event.key ===
            "Enter"
        ) {

            event.preventDefault();

            sendChatMessage();

        }

    }
);


/* =========================================================
   ESCAPE HTML
========================================================= */

function escapeHTML(text) {

    const div =
        document.createElement(
            "div"
        );


    div.textContent =
        text;


    return div.innerHTML;

}


/* =========================================================
   LEAVE MEETING
========================================================= */

function leaveMeeting() {

    const confirmed =
        confirm(
            "Are you sure you want to leave the meeting?"
        );


    if (!confirmed) {

        return;

    }


    /*
     * Stop local media.
     */

    if (localStream) {

        localStream
            .getTracks()
            .forEach(
                track => {

                    track.stop();

                }
            );

    }


    /*
     * Close peer connections.
     */

    Object.values(
        peerConnections
    ).forEach(
        peerConnection => {

            peerConnection.close();

        }
    );


    /*
     * Close WebSocket.
     */

    if (websocket) {

        websocket.close();

        websocket =
            null;

    }


    /*
     * Return dashboard.
     */

    window.location.href =
        "dashboard.html";

}


/* =========================================================
   PAGE CLOSE
========================================================= */

window.addEventListener(
    "beforeunload",
    function() {

        if (localStream) {

            localStream
                .getTracks()
                .forEach(
                    track => {

                        track.stop();

                    }
                );

        }


        Object.values(
            peerConnections
        ).forEach(
            peerConnection => {

                peerConnection.close();

            }
        );


        if (websocket) {

            websocket.close();

        }

    }
);


/* =========================================================
   INITIALIZE
========================================================= */

function initializeMeeting() {

    console.log(
        "Initializing Null Meeting..."
    );


    /*
     * Create local participant card.
     */

    createLocalCard();


    /*
     * Connect WebSocket.
     */

    connectWebSocket();

}


/* =========================================================
   START NULL MEETING
========================================================= */

initializeMeeting();

</script>
