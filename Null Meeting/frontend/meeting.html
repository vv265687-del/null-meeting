<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>NULL MEETING | Meeting</title>

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    >

    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
        rel="stylesheet"
    >

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background:
                radial-gradient(circle at top left, #18264d, transparent 35%),
                radial-gradient(circle at bottom right, #291449, transparent 35%),
                #080b14;

            color: white;
            font-family: "Inter", Arial, sans-serif;
            height: 100vh;
            overflow: hidden;
        }

        /* =========================
           TOP BAR
        ========================= */

        .top-bar {
            height: 68px;
            background: rgba(15, 18, 30, 0.94);
            border-bottom: 1px solid rgba(255,255,255,0.08);

            display: flex;
            align-items: center;
            justify-content: space-between;

            padding: 0 24px;

            backdrop-filter: blur(18px);

            position: relative;
            z-index: 20;
        }

        .logo {
            font-size: 21px;
            font-weight: 800;
            color: #60a5fa;
            white-space: nowrap;
        }

        .meeting-info {
            display: flex;
            align-items: center;
            gap: 8px;

            color: #9ca3af;
            font-size: 13px;
        }

        #meetingId {
            color: white;
            font-weight: 700;
            letter-spacing: 1px;
        }

        .participant-count {
            background: rgba(96,165,250,0.12);
            border: 1px solid rgba(96,165,250,0.2);

            color: #93c5fd;

            padding: 7px 12px;
            border-radius: 20px;

            font-size: 12px;
            white-space: nowrap;
        }

        /* =========================
           VIDEO AREA
        ========================= */

        .video-area {
            height: calc(100vh - 148px);
            padding: 18px;
            overflow: auto;
        }

        .video-grid {
            width: 100%;
            max-width: 1500px;
            min-height: 100%;

            margin: auto;

            display: grid;

            grid-template-columns:
                repeat(auto-fit, minmax(300px, 1fr));

            gap: 16px;
        }

        /* =========================
           VIDEO CARD
        ========================= */

        .video-card {
            position: relative;

            background:
                linear-gradient(
                    145deg,
                    #171c2b,
                    #0d111c
                );

            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 20px;

            overflow: hidden;

            min-height: 250px;

            display: flex;
            align-items: center;
            justify-content: center;

            box-shadow:
                0 15px 40px rgba(0,0,0,0.25);
        }

        .video-card video {
            width: 100%;
            height: 100%;

            object-fit: cover;

            display: none;
        }

        .local-video {
            transform: scaleX(-1);
        }

        .camera-off {
            text-align: center;
            color: #9ca3af;
        }

        .avatar {
            width: 82px;
            height: 82px;

            border-radius: 50%;

            display: flex;
            align-items: center;
            justify-content: center;

            margin: 0 auto 14px;

            background:
                linear-gradient(
                    135deg,
                    #2563eb,
                    #7c3aed
                );

            font-size: 30px;
            font-weight: 800;
            color: white;
        }

        .user-name {
            font-size: 17px;
            font-weight: 700;

            color: white;

            margin-bottom: 5px;
        }

        .camera-text {
            font-size: 13px;
            color: #8b93a5;
        }

        .video-label {
            position: absolute;

            left: 14px;
            bottom: 14px;

            background: rgba(0,0,0,0.65);

            padding: 7px 11px;

            border-radius: 8px;

            font-size: 13px;

            backdrop-filter: blur(8px);

            z-index: 5;
        }

        .connection-status {
            position: absolute;

            top: 14px;
            right: 14px;

            background: rgba(0,0,0,0.6);

            padding: 7px 10px;

            border-radius: 8px;

            font-size: 12px;

            color: #fbbf24;

            z-index: 5;
        }

        .connection-status.connected {
            color: #4ade80;
        }

        /* =========================
           CONTROLS
        ========================= */

        .controls {
            height: 80px;

            background: rgba(12,15,24,0.96);

            border-top:
                1px solid rgba(255,255,255,0.08);

            display: flex;

            justify-content: center;
            align-items: center;

            gap: 14px;

            backdrop-filter: blur(18px);

            position: relative;
            z-index: 30;
        }

        .control-btn {
            width: 52px;
            height: 52px;

            border-radius: 50%;

            border: none;

            background: #242a38;

            color: white;

            font-size: 18px;

            cursor: pointer;

            transition: 0.2s ease;

            position: relative;
        }

        .control-btn:hover {
            transform: translateY(-2px);
            background: #343b4c;
        }

        .control-btn.active {
            background: #2563eb;
        }

        .leave-btn {
            background: #dc2626;
            margin-left: 12px;
        }

        .leave-btn:hover {
            background: #ef4444;
        }

        /* =========================
           CHAT
        ========================= */

        .chat-badge {
            position: absolute;

            top: -3px;
            right: -3px;

            width: 18px;
            height: 18px;

            border-radius: 50%;

            background: #ef4444;

            color: white;

            font-size: 10px;

            display: none;

            align-items: center;
            justify-content: center;

            font-weight: 700;
        }

        .chat-badge.show {
            display: flex;
        }

        .chat-panel {
            position: fixed;

            top: 78px;
            right: 18px;

            width: 350px;
            height: calc(100vh - 178px);

            max-height: 650px;

            background: rgba(14,18,30,0.97);

            border: 1px solid rgba(255,255,255,0.1);

            border-radius: 18px;

            box-shadow:
                0 25px 70px rgba(0,0,0,0.5);

            backdrop-filter: blur(20px);

            z-index: 50;

            display: none;

            flex-direction: column;

            overflow: hidden;
        }

        .chat-panel.open {
            display: flex;
        }

        .chat-header {
            height: 60px;

            display: flex;

            align-items: center;

            justify-content: space-between;

            padding: 0 18px;

            border-bottom:
                1px solid rgba(255,255,255,0.08);
        }

        .chat-title {
            display: flex;

            align-items: center;

            gap: 10px;

            font-size: 16px;

            font-weight: 700;
        }

        .chat-title i {
            color: #60a5fa;
        }

        .close-chat {
            border: none;
            background: transparent;

            color: #9ca3af;

            font-size: 18px;

            cursor: pointer;

            width: 34px;
            height: 34px;

            border-radius: 8px;
        }

        .close-chat:hover {
            background: rgba(255,255,255,0.08);
            color: white;
        }

        .chat-messages {
            flex: 1;

            overflow-y: auto;

            padding: 16px;
        }

        .empty-chat {
            height: 100%;

            display: flex;

            align-items: center;
            justify-content: center;

            flex-direction: column;

            gap: 10px;

            color: #71798b;

            text-align: center;

            font-size: 13px;
        }

        .empty-chat i {
            font-size: 35px;
            color: #39445c;
        }

        .message {
            display: flex;

            flex-direction: column;

            margin-bottom: 14px;

            max-width: 85%;
        }

        .message.mine {
            margin-left: auto;
            align-items: flex-end;
        }

        .message.other {
            margin-right: auto;
            align-items: flex-start;
        }

        .message-sender {
            font-size: 11px;
            color: #8e98ac;
            margin-bottom: 4px;
        }

        .message-bubble {
            padding: 9px 12px;

            border-radius: 13px;

            font-size: 13px;

            line-height: 1.45;

            word-break: break-word;
        }

        .message.mine .message-bubble {
            background: #2563eb;
            color: white;

            border-bottom-right-radius: 4px;
        }

        .message.other .message-bubble {
            background: #242a38;
            color: #e5e7eb;

            border-bottom-left-radius: 4px;
        }

        .message-time {
            font-size: 9px;
            color: #626b7d;
            margin-top: 4px;
        }

        .chat-input-area {
            padding: 12px;

            border-top:
                1px solid rgba(255,255,255,0.08);

            display: flex;

            gap: 8px;
        }

        #chatInput {
            flex: 1;

            height: 42px;

            border: none;
            outline: none;

            border-radius: 10px;

            background: #202634;

            color: white;

            padding: 0 12px;

            font-size: 13px;
        }

        #chatInput::placeholder {
            color: #687184;
        }

        #sendChatBtn {
            width: 42px;
            height: 42px;

            border: none;

            border-radius: 10px;

            background: #2563eb;

            color: white;

            cursor: pointer;

            font-size: 15px;
        }

        /* =========================
           ADMIN BUTTON
        ========================= */

        #adminBtn {
            display: none;
        }

        /* =========================
           ADMIN PANEL
        ========================= */

        .admin-panel {
            position: fixed;

            top: 78px;
            left: 18px;

            width: 330px;

            max-height: calc(100vh - 110px);

            background: rgba(14,18,30,0.98);

            border:
                1px solid rgba(255,255,255,0.1);

            border-radius: 18px;

            box-shadow:
                0 25px 70px rgba(0,0,0,0.5);

            z-index: 60;

            display: none;

            overflow-y: auto;
        }

        .admin-panel.open {
            display: block;
        }

        .admin-header {
            padding: 18px;

            border-bottom:
                1px solid rgba(255,255,255,0.08);

            display: flex;

            justify-content: space-between;

            align-items: center;
        }

        .admin-header h3 {
            font-size: 16px;
        }

        .admin-section {
            padding: 15px 18px;

            border-bottom:
                1px solid rgba(255,255,255,0.06);
        }

        .admin-section-title {
            font-size: 12px;

            color: #8e98ac;

            margin-bottom: 10px;

            text-transform: uppercase;

            letter-spacing: 0.5px;
        }

        .admin-action {
            width: 100%;

            padding: 10px 12px;

            border: none;

            border-radius: 10px;

            background: #242a38;

            color: white;

            cursor: pointer;

            margin-bottom: 8px;

            text-align: left;
        }

        .admin-action:hover {
            background: #343b4c;
        }

        .waiting-user {
            background: #202634;

            border-radius: 10px;

            padding: 11px;

            margin-bottom: 8px;
        }

        .waiting-user-name {
            font-size: 13px;

            font-weight: 600;

            margin-bottom: 8px;
        }

        .waiting-actions {
            display: flex;
            gap: 7px;
        }

        .waiting-actions button {
            flex: 1;

            border: none;

            padding: 7px;

            border-radius: 7px;

            cursor: pointer;

            color: white;

            font-size: 11px;
        }

        .admit-btn {
            background: #16a34a;
        }

        .reject-btn {
            background: #dc2626;
        }

        /* =========================
           WAITING SCREEN
        ========================= */

        .waiting-screen {
            position: fixed;

            inset: 0;

            background:
                radial-gradient(
                    circle at top,
                    #18264d,
                    #080b14 65%
                );

            z-index: 200;

            display: none;

            align-items: center;
            justify-content: center;

            text-align: center;

            padding: 25px;
        }

        .waiting-screen.show {
            display: flex;
        }

        .waiting-box {
            width: min(430px, 100%);

            background: rgba(18,23,38,0.95);

            border:
                1px solid rgba(255,255,255,0.1);

            border-radius: 24px;

            padding: 35px 25px;

            box-shadow:
                0 30px 80px rgba(0,0,0,0.45);
        }

        .waiting-icon {
            width: 75px;
            height: 75px;

            border-radius: 50%;

            margin: 0 auto 20px;

            display: flex;

            align-items: center;
            justify-content: center;

            background:
                linear-gradient(
                    135deg,
                    #2563eb,
                    #7c3aed
                );

            font-size: 28px;
        }

        .waiting-box h2 {
            margin-bottom: 10px;
        }

        .waiting-box p {
            color: #9ca3af;
            font-size: 13px;
            line-height: 1.6;
        }

        .cancel-waiting {
            margin-top: 22px;

            padding: 11px 18px;

            border: none;

            border-radius: 10px;

            background: #242a38;

            color: white;

            cursor: pointer;
        }

        /* =========================
           TOAST
        ========================= */

        #toast {
            position: fixed;

            left: 50%;
            bottom: 100px;

            transform:
                translateX(-50%)
                translateY(20px);

            background:
                rgba(20,25,38,0.96);

            border:
                1px solid rgba(255,255,255,0.1);

            padding: 12px 18px;

            border-radius: 12px;

            opacity: 0;

            pointer-events: none;

            transition: 0.25s ease;

            z-index: 300;

            color: #e5e7eb;

            font-size: 13px;
        }

        #toast.show {
            opacity: 1;

            transform:
                translateX(-50%)
                translateY(0);
        }

        /* =========================
           MOBILE
        ========================= */

        @media (max-width: 700px) {

            .top-bar {
                padding: 0 12px;
            }

            .logo {
                font-size: 16px;
            }

            .meeting-info {
                font-size: 10px;
            }

            #meetingId {
                font-size: 9px;
            }

            .participant-count {
                display: none;
            }

            .video-area {
                padding: 10px;
            }

            .video-grid {
                grid-template-columns: 1fr;
            }

            .video-card {
                min-height: 230px;
            }

            .controls {
                gap: 6px;
            }

            .control-btn {
                width: 44px;
                height: 44px;
                font-size: 15px;
            }

            .leave-btn {
                margin-left: 4px;
            }

            .chat-panel {
                top: 74px;
                left: 10px;
                right: 10px;

                width: auto;

                height: calc(100vh - 160px);
            }

            .admin-panel {
                left: 10px;
                right: 10px;
                width: auto;
            }

        }

    </style>

</head>

<body>

<!-- =========================================================
     TOP BAR
========================================================= -->

<header class="top-bar">

    <div class="logo">

        <i class="fa-solid fa-video"></i>

        NULL MEETING

    </div>

    <div class="meeting-info">

        <span>Meeting ID:</span>

        <span id="meetingId">
            Loading...
        </span>

    </div>

    <div
        class="participant-count"
        id="participantCount"
    >
        👥 1 participant
    </div>

</header>


<!-- =========================================================
     VIDEO AREA
========================================================= -->

<main class="video-area">

    <div
        class="video-grid"
        id="videoGrid"
    ></div>

</main>


<!-- =========================================================
     CONTROLS
========================================================= -->

<div class="controls">

    <button
        class="control-btn"
        id="cameraBtn"
        onclick="toggleCamera()"
        title="Camera"
    >
        <i class="fa-solid fa-video"></i>
    </button>


    <button
        class="control-btn"
        id="micBtn"
        onclick="toggleMicrophone()"
        title="Microphone"
    >
        <i class="fa-solid fa-microphone"></i>
    </button>


    <button
        class="control-btn"
        id="screenBtn"
        onclick="shareScreen()"
        title="Share screen"
    >
        <i class="fa-solid fa-display"></i>
    </button>


    <button
        class="control-btn"
        id="chatBtn"
        onclick="toggleChat()"
        title="Chat"
    >
        <i class="fa-solid fa-comment"></i>

        <span
            class="chat-badge"
            id="chatBadge"
        >
            0
        </span>

    </button>


    <!-- HOST BUTTON -->

    <button
        class="control-btn"
        id="adminBtn"
        onclick="toggleAdminPanel()"
        title="Host controls"
    >
        <i class="fa-solid fa-crown"></i>
    </button>


    <button
        class="control-btn leave-btn"
        onclick="leaveMeeting()"
        title="Leave meeting"
    >
        <i class="fa-solid fa-phone"></i>
    </button>

</div>


<!-- =========================================================
     CHAT
========================================================= -->

<aside
    class="chat-panel"
    id="chatPanel"
>

    <div class="chat-header">

        <div class="chat-title">

            <i class="fa-solid fa-comments"></i>

            Meeting Chat

        </div>

        <button
            class="close-chat"
            onclick="toggleChat()"
        >
            <i class="fa-solid fa-xmark"></i>
        </button>

    </div>


    <div
        class="chat-messages"
        id="chatMessages"
    >

        <div
            class="empty-chat"
            id="emptyChat"
        >

            <i class="fa-regular fa-comments"></i>

            <span>
                No messages yet
            </span>

            <small>
                Start the conversation 👋
            </small>

        </div>

    </div>


    <div class="chat-input-area">

        <input
            type="text"
            id="chatInput"
            placeholder="Type a message..."
            maxlength="500"
            autocomplete="off"
        >

        <button
            id="sendChatBtn"
            onclick="sendChatMessage()"
        >
            <i class="fa-solid fa-paper-plane"></i>
        </button>

    </div>

</aside>


<!-- =========================================================
     ADMIN PANEL
========================================================= -->

<aside
    class="admin-panel"
    id="adminPanel"
>

    <div class="admin-header">

        <h3>
            <i class="fa-solid fa-crown"></i>
            Host Controls
        </h3>

        <button
            class="close-chat"
            onclick="toggleAdminPanel()"
        >
            <i class="fa-solid fa-xmark"></i>
        </button>

    </div>


    <!-- WAITING USERS -->

    <div class="admin-section">

        <div class="admin-section-title">
            Waiting Room
        </div>

        <div id="waitingList">

            <div
                style="
                    color:#71798b;
                    font-size:12px;
                "
            >
                No one is waiting.
            </div>

        </div>

    </div>


    <!-- MEETING SETTINGS -->

    <div class="admin-section">

        <div class="admin-section-title">
            Meeting Settings
        </div>

        <button
            class="admin-action"
            onclick="toggleWaitingRoom()"
        >
            <i class="fa-solid fa-door-open"></i>
            Toggle Waiting Room
        </button>


        <button
            class="admin-action"
            onclick="toggleLockMeeting()"
        >
            <i class="fa-solid fa-lock"></i>
            Lock / Unlock Meeting
        </button>


        <button
            class="admin-action"
            onclick="endMeeting()"
            style="color:#f87171;"
        >
            <i class="fa-solid fa-circle-xmark"></i>
            End Meeting For Everyone
        </button>

    </div>


    <div class="admin-section">

        <div class="admin-section-title">
            Participants
        </div>

        <div id="participantAdminList">
            Loading...
        </div>

    </div>

</aside>


<!-- =========================================================
     WAITING SCREEN
========================================================= -->

<div
    class="waiting-screen"
    id="waitingScreen"
>

    <div class="waiting-box">

        <div class="waiting-icon">

            <i class="fa-solid fa-hourglass-half"></i>

        </div>

        <h2>
            Please wait...
        </h2>

        <p id="waitingMessage">

            The host will let you into the meeting.

        </p>

        <button
            class="cancel-waiting"
            onclick="leaveWaitingRoom()"
        >
            Leave Meeting
        </button>

    </div>

</div>


<!-- =========================================================
     TOAST
========================================================= -->

<div id="toast"></div>


<script>

/* =========================================================
   CONFIGURATION
========================================================= */

const API_URL =
    "https://null-meeting.onrender.com";


/* =========================================================
   GET MEETING ID
========================================================= */

const urlParams =
    new URLSearchParams(
        window.location.search
    );

const meetingId =
    urlParams.get("meeting_id");


if (!meetingId) {

    alert("Meeting ID not found.");

    window.location.href =
        "dashboard.html";

}


/* =========================================================
   DISPLAY MEETING ID
========================================================= */

document.getElementById(
    "meetingId"
).innerText =
    meetingId;


/* =========================================================
   GET TOKEN
========================================================= */

const token =
    localStorage.getItem(
        "access_token"
    );


if (!token) {

    alert("Please login first.");

    window.location.href =
        "index.html";

}


/* =========================================================
   CURRENT USER
========================================================= */

let currentUser = null;

try {

    const savedUser =
        localStorage.getItem("user");

    if (savedUser) {

        currentUser =
            JSON.parse(savedUser);

    }

}
catch (error) {

    console.error(
        "User data error:",
        error
    );

}


const localUserName =
    currentUser?.name ||
    "You";


/* =========================================================
   WEBRTC VARIABLES
========================================================= */

let localStream = null;

let websocket = null;

let localParticipantId = null;

let isHost = false;

let cameraEnabled = false;

let microphoneEnabled = false;

let screenSharing = false;

let waitingInRoom = false;

let waitingRoomEnabled = true;

let meetingLocked = false;

let unreadMessages = 0;


/* =========================================================
   PEER CONNECTIONS
========================================================= */

const peerConnections = {};


/* =========================================================
   REMOTE STREAMS
========================================================= */

const remoteStreams = {};


/* =========================================================
   ICE QUEUE
========================================================= */

const pendingIceCandidates = {};


/* =========================================================
   RTC CONFIGURATION
========================================================= */

const rtcConfiguration = {

    iceServers: [

        {
            urls:
                "stun:stun.l.google.com:19302"
        },

        {
            urls:
                "stun:stun1.l.google.com:19302"
        }

    ]

};


/* =========================================================
   TOAST
========================================================= */

function showToast(message) {

    const toast =
        document.getElementById("toast");

    if (!toast) {
        return;
    }

    toast.innerText =
        message;

    toast.classList.add("show");

    setTimeout(
        () => {

            toast.classList.remove("show");

        },
        2500
    );

}


/* =========================================================
   PARTICIPANT COUNT
========================================================= */

function updateParticipantCount(count) {

    const element =
        document.getElementById(
            "participantCount"
        );

    if (!element) {
        return;
    }

    element.innerText =
        `👥 ${count} participant${
            count === 1 ? "" : "s"
        }`;

}


/* =========================================================
   LOCAL CARD
========================================================= */

function createLocalCard() {

    const grid =
        document.getElementById(
            "videoGrid"
        );

    if (
        document.getElementById(
            "local-card"
        )
    ) {
        return;
    }

    const card =
        document.createElement("div");

    card.className =
        "video-card";

    card.id =
        "local-card";

    card.innerHTML = `

        <video
            id="localVideo"
            class="local-video"
            autoplay
            muted
            playsinline
        ></video>

        <div
            class="camera-off"
            id="localCameraOff"
        >

            <div class="avatar">
                ${escapeHTML(
                    localUserName
                        .charAt(0)
                        .toUpperCase()
                )}
            </div>

            <div class="user-name">
                ${escapeHTML(localUserName)}
            </div>

            <div class="camera-text">
                Camera is off
            </div>

        </div>

        <div class="video-label">
            ${escapeHTML(localUserName)} (You)
        </div>

    `;

    grid.appendChild(card);

}


/* =========================================================
   REMOTE CARD
========================================================= */

function createRemoteCard(
    participantId,
    participantName = "Participant"
) {

    const existing =
        document.getElementById(
            `remote-${participantId}`
        );

    if (existing) {

        const label =
            existing.querySelector(
                ".video-label"
            );

        const userName =
            existing.querySelector(
                ".user-name"
            );

        if (label) {
            label.innerText =
                participantName;
        }

        if (userName) {
            userName.innerText =
                participantName;
        }

        return existing;

    }


    const grid =
        document.getElementById(
            "videoGrid"
        );

    const card =
        document.createElement("div");

    card.className =
        "video-card";

    card.id =
        `remote-${participantId}`;

    card.innerHTML = `

        <video
            id="video-${participantId}"
            autoplay
            playsinline
        ></video>

        <div
            class="camera-off"
            id="placeholder-${participantId}"
        >

            <div class="avatar">
                <i class="fa-solid fa-user"></i>
            </div>

            <div class="user-name">
                ${escapeHTML(participantName)}
            </div>

            <div class="camera-text">
                Camera is off
            </div>

        </div>

        <div class="video-label">
            ${escapeHTML(participantName)}
        </div>

        <div
            class="connection-status"
            id="status-${participantId}"
        >
            Connecting...
        </div>

    `;

    grid.appendChild(card);

    return card;

}


/* =========================================================
   UPDATE REMOTE NAME
========================================================= */

function updateRemoteName(
    participantId,
    name
) {

    const card =
        document.getElementById(
            `remote-${participantId}`
        );

    if (!card) {
        return;
    }

    const label =
        card.querySelector(
            ".video-label"
        );

    const userName =
        card.querySelector(
            ".user-name"
        );

    if (label) {
        label.innerText =
            name;
    }

    if (userName) {
        userName.innerText =
            name;
    }

}


/* =========================================================
   REMOVE REMOTE
========================================================= */

function removeRemoteParticipant(
    participantId
) {

    if (
        peerConnections[
            participantId
        ]
    ) {

        try {

            peerConnections[
                participantId
            ].close();

        }
        catch (error) {}

        delete peerConnections[
            participantId
        ];

    }

    delete remoteStreams[
        participantId
    ];

    delete pendingIceCandidates[
        participantId
    ];

    const card =
        document.getElementById(
            `remote-${participantId}`
        );

    if (card) {
        card.remove();
    }

}


/* =========================================================
   REMOTE STATUS
========================================================= */

function setRemoteStatus(
    participantId,
    text,
    connected = false
) {

    const status =
        document.getElementById(
            `status-${participantId}`
        );

    if (!status) {
        return;
    }

    status.innerText =
        text;

    if (connected) {

        status.classList.add(
            "connected"
        );

    }
    else {

        status.classList.remove(
            "connected"
        );

    }

}


/* =========================================================
   CREATE PEER CONNECTION
========================================================= */

function createPeerConnection(
    participantId,
    participantName = "Participant"
) {

    if (
        peerConnections[
            participantId
        ]
    ) {

        return peerConnections[
            participantId
        ];

    }


    console.log(
        "Creating peer connection:",
        participantId
    );


    createRemoteCard(
        participantId,
        participantName
    );


    const peerConnection =
        new RTCPeerConnection(
            rtcConfiguration
        );


    peerConnections[
        participantId
    ] =
        peerConnection;


    const remoteStream =
        new MediaStream();


    remoteStreams[
        participantId
    ] =
        remoteStream;


    const remoteVideo =
        document.getElementById(
            `video-${participantId}`
        );


    if (remoteVideo) {

        remoteVideo.srcObject =
            remoteStream;

    }


    /* =========================
       LOCAL TRACKS
    ========================= */

    if (localStream) {

        localStream
            .getTracks()
            .forEach(
                track => {

                    const alreadyAdded =
                        peerConnection
                            .getSenders()
                            .some(
                                sender =>
                                    sender.track &&
                                    sender.track.id ===
                                    track.id
                            );

                    if (!alreadyAdded) {

                        peerConnection.addTrack(
                            track,
                            localStream
                        );

                    }

                }
            );

    }


    /* =========================
       REMOTE TRACK
    ========================= */

    peerConnection.ontrack =
        function(event) {

            console.log(
                "Remote track received:",
                participantId
            );


            if (
                event.streams &&
                event.streams.length > 0
            ) {

                event.streams[0]
                    .getTracks()
                    .forEach(
                        track => {

                            const exists =
                                remoteStream
                                    .getTracks()
                                    .some(
                                        existing =>
                                            existing.id ===
                                            track.id
                                    );

                            if (!exists) {

                                remoteStream.addTrack(
                                    track
                                );

                            }

                        }
                    );

            }
            else if (event.track) {

                const exists =
                    remoteStream
                        .getTracks()
                        .some(
                            existing =>
                                existing.id ===
                                event.track.id
                        );

                if (!exists) {

                    remoteStream.addTrack(
                        event.track
                    );

                }

            }


            if (remoteVideo) {

                remoteVideo.srcObject =
                    remoteStream;

                remoteVideo.style.display =
                    "block";

            }


            const placeholder =
                document.getElementById(
                    `placeholder-${participantId}`
                );

            if (placeholder) {

                placeholder.style.display =
                    "none";

            }


            setRemoteStatus(
                participantId,
                "Connected",
                true
            );

        };


    /* =========================
       ICE
    ========================= */

    peerConnection.onicecandidate =
        function(event) {

            if (
                event.candidate &&
                websocket &&
                websocket.readyState ===
                    WebSocket.OPEN
            ) {

                websocket.send(
                    JSON.stringify({

                        type:
                            "ice-candidate",

                        target_id:
                            participantId,

                        candidate:
                            event.candidate

                    })
                );

            }

        };


    /* =========================
       CONNECTION STATE
    ========================= */

    peerConnection.onconnectionstatechange =
        function() {

            console.log(
                "Connection:",
                participantId,
                peerConnection.connectionState
            );


            if (
                peerConnection.connectionState ===
                "connected"
            ) {

                setRemoteStatus(
                    participantId,
                    "Connected",
                    true
                );

            }


            else if (
                peerConnection.connectionState ===
                "connecting"
            ) {

                setRemoteStatus(
                    participantId,
                    "Connecting..."
                );

            }


            else if (
                peerConnection.connectionState ===
                "disconnected"
            ) {

                setRemoteStatus(
                    participantId,
                    "Disconnected"
                );

            }


            else if (
                peerConnection.connectionState ===
                "failed"
            ) {

                setRemoteStatus(
                    participantId,
                    "Connection failed"
                );

            }

        };


    return peerConnection;

}


/* =========================================================
   CREATE OFFER
========================================================= */

async function createOfferForParticipant(
    participantId
) {

    try {

        const peerConnection =
            peerConnections[
                participantId
            ] ||
            createPeerConnection(
                participantId
            );


        const offer =
            await peerConnection.createOffer();


        await peerConnection.setLocalDescription(
            offer
        );


        if (
            websocket &&
            websocket.readyState ===
                WebSocket.OPEN
        ) {

            websocket.send(
                JSON.stringify({

                    type:
                        "offer",

                    target_id:
                        participantId,

                    offer:
                        peerConnection.localDescription

                })
            );

        }


        console.log(
            "Offer sent:",
            participantId
        );

    }
    catch (error) {

        console.error(
            "Create offer error:",
            error
        );

    }

}


/* =========================================================
   HANDLE OFFER
========================================================= */

async function handleOffer(
    senderId,
    offer
) {

    try {

        console.log(
            "Offer received:",
            senderId
        );


        const peerConnection =
            createPeerConnection(
                senderId
            );


        await peerConnection.setRemoteDescription(
            new RTCSessionDescription(
                offer
            )
        );


        await flushIceCandidates(
            senderId
        );


        const answer =
            await peerConnection.createAnswer();


        await peerConnection.setLocalDescription(
            answer
        );


        if (
            websocket &&
            websocket.readyState ===
                WebSocket.OPEN
        ) {

            websocket.send(
                JSON.stringify({

                    type:
                        "answer",

                    target_id:
                        senderId,

                    answer:
                        peerConnection.localDescription

                })
            );

        }


        console.log(
            "Answer sent:",
            senderId
        );

    }
    catch (error) {

        console.error(
            "Handle offer error:",
            error
        );

    }

}


/* =========================================================
   HANDLE ANSWER
========================================================= */

async function handleAnswer(
    senderId,
    answer
) {

    try {

        const peerConnection =
            peerConnections[
                senderId
            ];


        if (!peerConnection) {

            console.warn(
                "Peer connection not found:",
                senderId
            );

            return;

        }


        await peerConnection.setRemoteDescription(
            new RTCSessionDescription(
                answer
            )
        );


        await flushIceCandidates(
            senderId
        );


        console.log(
            "Answer accepted:",
            senderId
        );

    }
    catch (error) {

        console.error(
            "Handle answer error:",
            error
        );

    }

}


/* =========================================================
   HANDLE ICE
========================================================= */

async function handleIceCandidate(
    senderId,
    candidate
) {

    try {

        const peerConnection =
            peerConnections[
                senderId
            ];


        if (!peerConnection) {

            if (
                !pendingIceCandidates[
                    senderId
                ]
            ) {

                pendingIceCandidates[
                    senderId
                ] = [];

            }

            pendingIceCandidates[
                senderId
            ].push(candidate);

            return;

        }


        if (
            peerConnection.remoteDescription
        ) {

            await peerConnection.addIceCandidate(
                new RTCIceCandidate(
                    candidate
                )
            );

        }
        else {

            if (
                !pendingIceCandidates[
                    senderId
                ]
            ) {

                pendingIceCandidates[
                    senderId
                ] = [];

            }

            pendingIceCandidates[
                senderId
            ].push(candidate);

        }

    }
    catch (error) {

        console.error(
            "ICE error:",
            error
        );

    }

}


/* =========================================================
   FLUSH ICE
========================================================= */

async function flushIceCandidates(
    participantId
) {

    const peerConnection =
        peerConnections[
            participantId
        ];

    const candidates =
        pendingIceCandidates[
            participantId
        ] || [];


    if (
        !peerConnection ||
        !peerConnection.remoteDescription
    ) {

        return;

    }


    for (
        const candidate
        of candidates
    ) {

        try {

            await peerConnection.addIceCandidate(
                new RTCIceCandidate(
                    candidate
                )
            );

        }
        catch (error) {

            console.error(
                "Queued ICE error:",
                error
            );

        }

    }


    pendingIceCandidates[
        participantId
    ] = [];

}


/* =========================================================
   CONNECT WEBSOCKET
========================================================= */

function connectWebSocket() {

    if (!meetingId || !token) {
        return;
    }


    const websocketProtocol =
        API_URL.startsWith("https://")
            ? "wss:"
            : "ws:";


    const websocketHost =
        API_URL.replace(
            /^https?:\/\//,
            ""
        );


    /*
     * IMPORTANT:
     * Backend requires:
     *
     * /ws/{meeting_id}?token=JWT
     */

    const websocketURL =
        `${websocketProtocol}//${websocketHost}/ws/${
            encodeURIComponent(meetingId)
        }?token=${
            encodeURIComponent(token)
        }`;


    console.log(
        "Connecting WebSocket:",
        websocketURL.replace(
            token,
            "TOKEN_HIDDEN"
        )
    );


    websocket =
        new WebSocket(
            websocketURL
        );


    /* =========================
       OPEN
    ========================= */

    websocket.onopen =
        function() {

            console.log(
                "WebSocket connected."
            );

            showToast(
                "Connected to meeting 🟢"
            );

        };


    /* =========================
       MESSAGE
    ========================= */

    websocket.onmessage =
        async function(event) {

            try {

                const message =
                    JSON.parse(
                        event.data
                    );


                console.log(
                    "WebSocket message:",
                    message
                );


                /* =========================
                   ROOM INFO
                ========================= */

                if (
                    message.type ===
                    "room_info"
                ) {

                    localParticipantId =
                        message.participant_id;


                    isHost =
                        message.is_host === true;


                    waitingRoomEnabled =
                        message.waiting_room === true;


                    meetingLocked =
                        message.locked === true;


                    updateParticipantCount(
                        message.participants
                    );


                    if (isHost) {

                        document.getElementById(
                            "adminBtn"
                        ).style.display =
                            "block";

                        showToast(
                            "👑 You are the meeting host"
                        );

                    }


                    /*
                     * Existing participants.
                     */

                    const details =
                        message.existing_participant_details ||
                        [];


                    for (
                        const participant
                        of details
                    ) {

                        createPeerConnection(
                            participant.participant_id,
                            participant.name
                        );

                    }




                    updateAdminParticipantList(
                        message.participant_details ||
                        []
                    );

                }


                /* =========================
                   WAITING ROOM
                ========================= */

                else if (
                    message.type ===
                    "waiting_room"
                ) {

                    localParticipantId =
                        message.participant_id;


                    waitingInRoom =
                        true;


                    document.getElementById(
                        "waitingMessage"
                    ).innerText =
                        message.message ||
                        "The host will let you into the meeting.";


                    document.getElementById(
                        "waitingScreen"
                    ).classList.add(
                        "show"
                    );


                    showToast(
                        "Waiting for host approval..."
                    );

                }


                /* =========================
                   ADMITTED
                ========================= */

                else if (
                    message.type ===
                    "admitted"
                ) {

                    waitingInRoom =
                        false;


                    document.getElementById(
                        "waitingScreen"
                    ).classList.remove(
                        "show"
                    );


                    showToast(
                        "You have been admitted! 🎉"
                    );

                }


                /* =========================
                   JOIN REQUEST
                ========================= */

                else if (
                    message.type ===
                    "join_request"
                ) {

                    if (isHost) {

                        addWaitingUser(
                            message
                        );

                        showToast(
                            `${message.name} is waiting to join.`
                        );

                    }

                }


                /* =========================
                   USER JOINED
                ========================= */

                else if (
                    message.type ===
                    "user_joined"
                ) {

                    updateParticipantCount(
                        message.participants
                    );


                    if (
                        message.participant_id
                    ) {

                        createRemoteCard(
                            message.participant_id,
                            message.name ||
                            "Participant"
                        );

                        // The existing participant is the WebRTC offerer.
                        // This avoids offer/answer glare when both browsers join.
                        setTimeout(() => {
                            createOfferForParticipant(
                                message.participant_id
                            );
                        }, 150);

                    }


                    updateAdminParticipantList();


                    showToast(
                        `${
                            message.name ||
                            "Someone"
                        } joined the meeting 👋`
                    );

                }


                /* =========================
                   OFFER
                ========================= */

                else if (
                    message.type ===
                    "offer"
                ) {

                    await handleOffer(
                        message.sender_id,
                        message.offer
                    );

                }


                /* =========================
                   ANSWER
                ========================= */

                else if (
                    message.type ===
                    "answer"
                ) {

                    await handleAnswer(
                        message.sender_id,
                        message.answer
                    );

                }


                /* =========================
                   ICE
                ========================= */

                else if (
                    message.type ===
                    "ice-candidate"
                ) {

                    await handleIceCandidate(
                        message.sender_id,
                        message.candidate
                    );

                }


                /* =========================
                   USER LEFT
                ========================= */

                else if (
                    message.type ===
                    "user_left"
                ) {

                    updateParticipantCount(
                        message.participants
                    );


                    removeRemoteParticipant(
                        message.participant_id
                    );


                    updateAdminParticipantList();


                    showToast(
                        `${
                            message.name ||
                            "Participant"
                        } left the meeting.`
                    );

                }


                /* =========================
                   CHAT
                ========================= */

                else if (
                    message.type ===
                    "chat"
                ) {

                    if (
                        message.sender_id &&
                        message.sender_id ===
                            localParticipantId
                    ) {

                        return;

                    }


                    addChatMessage(
                        message.sender_name ||
                        "Participant",
                        message.text ||
                        "",
                        false
                    );


                    const chatPanel =
                        document.getElementById(
                            "chatPanel"
                        );


                    if (
                        !chatPanel.classList.contains(
                            "open"
                        )
                    ) {

                        unreadMessages++;

                        updateChatBadge();

                        showToast(
                            `New message from ${
                                message.sender_name ||
                                "Participant"
                            } 💬`
                        );

                    }

                }


                /* =========================
                   WAITING UPDATED
                ========================= */

                else if (
                    message.type ===
                    "waiting_updated"
                ) {

                    renderWaitingList(
                        message.waiting ||
                        []
                    );

                }


                /* =========================
                   WAITING ROOM STATE
                ========================= */

                else if (
                    message.type ===
                    "waiting_room_state"
                ) {

                    waitingRoomEnabled =
                        message.enabled === true;

                    meetingLocked =
                        message.locked === true;

                    showToast(
                        waitingRoomEnabled
                            ? "Waiting room enabled"
                            : "Waiting room disabled"
                    );

                }


                /* =========================
                   LOCK MEETING
                ========================= */

                else if (
                    message.type ===
                    "lock_meeting"
                ) {

                    meetingLocked =
                        message.locked === true;

                    showToast(
                        meetingLocked
                            ? "Meeting locked 🔒"
                            : "Meeting unlocked 🔓"
                    );

                }


                /* =========================
                   MUTE
                ========================= */

                else if (
                    message.type ===
                    "mute_participant"
                ) {

                    if (
                        message.target_id ===
                        localParticipantId
                    ) {

                        if (localStream) {

                            localStream
                                .getAudioTracks()
                                .forEach(
                                    track => {

                                        track.enabled =
                                            false;

                                    }
                                );

                        }

                        microphoneEnabled =
                            false;

                        document.getElementById(
                            "micBtn"
                        ).classList.remove(
                            "active"
                        );

                        showToast(
                            "The host muted your microphone."
                        );

                    }

                }


                /* =========================
                   END MEETING
                ========================= */

                else if (
                    message.type ===
                    "end_meeting"
                ) {

                    showToast(
                        message.message ||
                        "Meeting ended."
                    );


                    cleanupMeeting();


                    setTimeout(
                        () => {

                            window.location.href =
                                "dashboard.html";

                        },
                        1200
                    );

                }


                /* =========================
                   REMOVED
                ========================= */

                else if (
                    message.type ===
                    "removed"
                ) {

                    alert(
                        message.message ||
                        "You were removed from the meeting."
                    );


                    cleanupMeeting();


                    window.location.href =
                        "dashboard.html";

                }


                /* =========================
                   REJECTED
                ========================= */

                else if (
                    message.type ===
                    "rejected"
                ) {

                    alert(
                        message.message ||
                        "The host rejected your request."
                    );


                    cleanupMeeting();


                    window.location.href =
                        "dashboard.html";

                }


                /* =========================
                   ERROR
                ========================= */

                else if (
                    message.type ===
                    "error"
                ) {

                    showToast(
                        message.message ||
                        "Something went wrong."
                    );

                }

            }
            catch (error) {

                console.error(
                    "WebSocket message error:",
                    error
                );

            }

        };


    /* =========================
       ERROR
    ========================= */

    websocket.onerror =
        function(error) {

            console.error(
                "WebSocket error:",
                error
            );


            showToast(
                "WebSocket connection error ❌"
            );

        };


    /* =========================
       CLOSE
    ========================= */

    websocket.onclose =
        function(event) {

            console.log(
                "WebSocket closed:",
                event.code,
                event.reason
            );

        };

}


/* =========================================================
   START LOCAL MEDIA
========================================================= */

async function startLocalMedia(
    video = false,
    audio = false
) {

    try {

        const stream =
            await navigator.mediaDevices
                .getUserMedia({

                    video:
                        video,

                    audio:
                        audio

                });


        if (!localStream) {

            localStream =
                new MediaStream();

        }


        stream
            .getTracks()
            .forEach(
                track => {

                    localStream.addTrack(
                        track
                    );

                }
            );


        const localVideo =
            document.getElementById(
                "localVideo"
            );


        if (localVideo) {

            localVideo.srcObject =
                localStream;

        }


        /*
         * Add tracks to existing peers.
         */

        Object.values(
            peerConnections
        ).forEach(
            peerConnection => {

                stream
                    .getTracks()
                    .forEach(
                        track => {

                            const exists =
                                peerConnection
                                    .getSenders()
                                    .some(
                                        sender =>
                                            sender.track &&
                                            sender.track.kind ===
                                            track.kind
                                    );


                            if (!exists) {

                                peerConnection.addTrack(
                                    track,
                                    localStream
                                );

                            }

                        }
                    );

            }
        );


        return true;

    }
    catch (error) {

        console.error(
            "Media error:",
            error
        );


        return false;

    }

}


/* =========================================================
   RENEGOTIATE ALL PEERS
========================================================= */

async function renegotiateAll() {

    for (
        const participantId
        of Object.keys(
            peerConnections
        )
    ) {

        await createOfferForParticipant(
            participantId
        );

    }

}


/* =========================================================
   CAMERA
========================================================= */

async function toggleCamera() {

    if (!cameraEnabled) {

        const success =
            await startLocalMedia(
                true,
                false
            );


        if (!success) {

            alert(
                "Camera permission was denied or camera is unavailable."
            );

            return;

        }


        localStream
            .getVideoTracks()
            .forEach(
                track => {

                    track.enabled =
                        true;

                }
            );


        const localVideo =
            document.getElementById(
                "localVideo"
            );


        const cameraOff =
            document.getElementById(
                "localCameraOff"
            );


        localVideo.style.display =
            "block";

        cameraOff.style.display =
            "none";


        cameraEnabled =
            true;


        document.getElementById(
            "cameraBtn"
        ).classList.add(
            "active"
        );


        showToast(
            "Camera turned on 🎥"
        );


        await renegotiateAll();

    }
    else {

        if (localStream) {

            localStream
                .getVideoTracks()
                .forEach(
                    track => {

                        track.enabled =
                            false;

                    }
                );

        }


        document.getElementById(
            "localVideo"
        ).style.display =
            "none";


        document.getElementById(
            "localCameraOff"
        ).style.display =
            "block";


        cameraEnabled =
            false;


        document.getElementById(
            "cameraBtn"
        ).classList.remove(
            "active"
        );


        showToast(
            "Camera turned off"
        );

    }

}

/* =========================================================
   SCREEN SHARE
========================================================= */

async function shareScreen() {

    try {

        const screenStream =
            await navigator.mediaDevices
                .getDisplayMedia({

                    video: true

                });


        const screenTrack =
            screenStream
                .getVideoTracks()[0];


        const localVideo =
            document.getElementById(
                "localVideo"
            );


        localVideo.srcObject =
            screenStream;


        localVideo.style.display =
            "block";


        document.getElementById(
            "localCameraOff"
        ).style.display =
            "none";


        screenSharing =
            true;


        document.getElementById(
            "screenBtn"
        ).classList.add(
            "active"
        );


        for (
            const peerConnection
            of Object.values(
                peerConnections
            )
        ) {

            const sender =
                peerConnection
                    .getSenders()
                    .find(
                        sender =>
                            sender.track &&
                            sender.track.kind ===
                            "video"
                    );


            if (sender) {

                await sender.replaceTrack(
                    screenTrack
                );

            }
            else {

                peerConnection.addTrack(
                    screenTrack
                );

            }

        }


        await renegotiateAll();


        showToast(
            "Screen sharing started 🖥️"
        );


        screenTrack.onended =
            async function() {

                screenSharing =
                    false;


                document.getElementById(
                    "screenBtn"
                ).classList.remove(
                    "active"
                );


                if (
                    cameraEnabled &&
                    localStream
                ) {

                    const cameraTrack =
                        localStream
                            .getVideoTracks()[0];


                    if (cameraTrack) {

                        for (
                            const peerConnection
                            of Object.values(
                                peerConnections
                            )
                        ) {

                            const sender =
                                peerConnection
                                    .getSenders()
                                    .find(
                                        sender =>
                                            sender.track &&
                                            sender.track.kind ===
                                            "video"
                                    );


                            if (sender) {

                                await sender.replaceTrack(
                                    cameraTrack
                                );

                            }

                        }


                        localVideo.srcObject =
                            localStream;

                    }

                }
                else {

                    localVideo.style.display =
                        "none";

                    document.getElementById(
                        "localCameraOff"
                    ).style.display =
                        "block";

                }


                await renegotiateAll();


                showToast(
                    "Screen sharing stopped"
                );

            };

    }
    catch (error) {

        console.log(
            "Screen sharing cancelled."
        );

    }

}


/* =========================================================

========================================================= */

function toggleChat() {

/* =========================================================
   SEND CHAT
========================================================= */

function sendChatMessage() {

    const input =
        document.getElementById(
            "chatInput"
        );


    const text =
        input.value.trim();


    if (!text) {
        return;
    }


    if (
        !websocket ||
        websocket.readyState !==
            WebSocket.OPEN
    ) {

        showToast(
            "Chat is not connected."
        );

        return;

    }


    addChatMessage(
        localUserName,
        text,
        true
    );


    websocket.send(
        JSON.stringify({

            type:
                "chat",

            sender_id:
                localParticipantId,

            sender_name:
                localUserName,

            text:
                text

        })
    );


    input.value =
        "";

}


/* =========================================================
   ADD CHAT MESSAGE
========================================================= */

function addChatMessage(
    senderName,
    text,
    isMine
) {

    const messages =
        document.getElementById(
            "chatMessages"
        );


    const emptyChat =
        document.getElementById(
            "emptyChat"
        );


    if (emptyChat) {
        emptyChat.remove();
    }


    const message =
        document.createElement(
            "div"
        );


    message.className =
        `message ${
            isMine
                ? "mine"
                : "other"
        }`;


    const sender =
        document.createElement(
            "div"
        );


    sender.className =
        "message-sender";


    sender.innerText =
        isMine
            ? "You"
            : senderName;


    const bubble =
        document.createElement(
            "div"
        );


    bubble.className =
        "message-bubble";


    bubble.textContent =
        text;


    const time =
        document.createElement(
            "div"
        );


    time.className =
        "message-time";


    time.innerText =
        getCurrentTime();


    message.appendChild(
        sender
    );


    message.appendChild(
        bubble
    );


    message.appendChild(
        time
    );


    messages.appendChild(
        message
    );


    messages.scrollTop =
        messages.scrollHeight;

}


/* =========================================================
   CHAT BADGE
========================================================= */

function updateChatBadge() {

    const badge =
        document.getElementById(
            "chatBadge"
        );


    if (
        unreadMessages <= 0
    ) {

        badge.classList.remove(
            "show"
        );

        return;

    }


    badge.innerText =
        unreadMessages > 9
            ? "9+"
            : unreadMessages;


    badge.classList.add(
        "show"
    );

}


/* =========================================================
   CURRENT TIME
========================================================= */

function getCurrentTime() {

    return new Date().toLocaleTimeString(
        [],
        {
            hour: "2-digit",
            minute: "2-digit"
        }
    );

}


/* =========================================================
   ENTER CHAT
========================================================= */

document.getElementById(
    "chatInput"
).addEventListener(

    function(event) {

        if (
            event.key ===
            "Enter"
        ) {

            event.preventDefault();
