);


/* =========================================================
   WAITING ROOM - HOST
========================================================= */

const waitingUsers = {};


function addWaitingUser(
    participant
) {

    waitingUsers[
        participant.participant_id
    ] =
        participant;


    renderWaitingList();

}


function renderWaitingList(
    serverWaiting = null
) {

    const list =
        document.getElementById(
            "waitingList"
        );


    if (serverWaiting) {

        Object.keys(
            waitingUsers
        ).forEach(
            id => {

                if (
                    !serverWaiting.some(
                        user =>
                            user.participant_id ===
                            id
                    )
                ) {

                    delete waitingUsers[id];

                }

            }
        );


        serverWaiting.forEach(
            user => {

                waitingUsers[
                    user.participant_id
                ] =
                    user;

            }
        );

    }


    const users =
        Object.values(
            waitingUsers
        );


    if (users.length === 0) {

        list.innerHTML = `

            <div
                style="
                    color:#71798b;
                    font-size:12px;
                "
            >
                No one is waiting.
            </div>

        `;

        return;

    }


    list.innerHTML =
        "";


    users.forEach(
        user => {

            const item =
                document.createElement(
                    "div"
                );


            item.className =
                "waiting-user";


            item.innerHTML = `

                <div class="waiting-user-name">

                    <i class="fa-solid fa-user"></i>

                    ${escapeHTML(
                        user.name ||
                        "Participant"
                    )}

                </div>

                <div class="waiting-actions">

                    <button
                        class="admit-btn"
                        onclick="admitParticipant('${
                            user.participant_id
                        }')"
                    >
                        Admit
                    </button>

                    <button
                        class="reject-btn"
                        onclick="rejectParticipant('${
                            user.participant_id
                        }')"
                    >
                        Reject
                    </button>

                </div>

            `;


            list.appendChild(
                item
            );

        }
    );

}


/* =========================================================
   ADMIT PARTICIPANT
========================================================= */

function admitParticipant(
    participantId
) {

    if (!isHost) {
        return;
    }


    if (
        !websocket ||
        websocket.readyState !==
            WebSocket.OPEN
    ) {
        return;
    }


    websocket.send(
        JSON.stringify({

            type:
                "admit_participant",

            target_id:
                participantId

        })
    );


    delete waitingUsers[
        participantId
    ];


    renderWaitingList();


    showToast(
        "Participant admitted."
    );

}


/* =========================================================
   REJECT PARTICIPANT
========================================================= */

function rejectParticipant(
    participantId
) {

    if (!isHost) {
        return;
    }


    websocket.send(
        JSON.stringify({

            type:
                "reject_participant",

            target_id:
                participantId

    );

        participantId
    ];


    renderWaitingList();


    showToast(
        "Participant rejected."
    );

}

/* =========================================================
   ADMIN PARTICIPANT LIST
========================================================= */

function updateAdminParticipantList(
    participants = null
) {

    const container =
        document.getElementById(
            "participantAdminList"
        );


    if (!container) {
        return;
    }


    if (
        participants &&
        participants.length
    ) {

        container.innerHTML =
            "";


        participants.forEach(
            participant => {

                const item =
                    document.createElement(
                        "div"
                    );


                item.style.cssText =
                    `
                    background:#202634;
                    padding:10px;
                    border-radius:9px;
                    margin-bottom:7px;
                    font-size:12px;
                    `;


                item.innerHTML = `

                    <div style="font-weight:600;">

                        <i class="fa-solid fa-user"></i>

                        ${escapeHTML(
                            participant.name
                        )}

                        ${
                            participant.is_host
                                ? " 👑"
                                : ""
                        }

                    </div>

                `;


                if (
                    !participant.is_host &&
                    participant.participant_id !==
                        localParticipantId
                ) {

                    const button =
                        document.createElement(
                            "button"
                        );


                    button.innerText =
                        "Remove";


                    button.style.cssText =
                        `
                        margin-top:7px;
                        width:100%;
                        border:none;
                        padding:6px;
                        border-radius:7px;
                        background:#dc2626;
                        color:white;
                        cursor:pointer;
                        `;


                    button.onclick =
                        function() {

                            removeParticipant(
                                participant.participant_id
                            );

                        };


                    item.appendChild(
                        button
                    );

                }


                container.appendChild(
                    item
                );

            }
        );

    }
    else {

        container.innerHTML = `

            <div
                style="
                    color:#71798b;
                    font-size:12px;
                "
            >
                Participant list will appear here.
            </div>

        `;

    }

}

            document.getElementById(
                "adminPanel"
            );

            document.getElementById(
                "adminBtn"
            );

        ) {

            );

/* =========================================================
   LEAVE WAITING ROOM
========================================================= */

function leaveWaitingRoom() {

    if (
        websocket &&
        websocket.readyState ===
            WebSocket.OPEN
    ) {

        websocket.send(
            JSON.stringify({

                type:
                    "leave_waiting"

            })
        );

    }


    cleanupMeeting();


    window.location.href =
        "dashboard.html";

}


/* =========================================================
   CLEANUP
========================================================= */

function cleanupMeeting() {

    if (localStream) {

        localStream
            .getTracks()
            .forEach(
                track => {

                    track.stop();

                }
            );

        localStream =
            null;

    }


    Object.values(
        peerConnections
    ).forEach(
        peerConnection => {

            try {
                peerConnection.close();
            }
            catch (error) {}

        }
    );


    if (websocket) {

        try {
            websocket.close();
        }
        catch (error) {}

        websocket =
            null;

    }

}


/* =========================================================
   LEAVE MEETING
========================================================= */

function leaveMeeting() {

    const confirmed =
        confirm(
            "Are you sure you want to leave the meeting?"
        );


    if (!confirmed) {
        return;
    }


    cleanupMeeting();


    window.location.href =
        "dashboard.html";

}

========================================================= */

        if (localStream) {

                    }
                );

        Object.values(
            peerConnections
        ).forEach(
            peerConnection => {

                try {
                    peerConnection.close();
                }
                catch (error) {}

            }
        );


        if (websocket) {

            try {
                websocket.close();
            }
            catch (error) {}

        }

    }
);


/* =========================================================
   ESCAPE HTML
========================================================= */

function escapeHTML(text) {

    const div =
        document.createElement(
            "div"
        );


    div.textContent =
        String(text);


    return div.innerHTML;

}
