<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>PROJECT-X Login</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #111827;
        }

        .login-box {
            width: 380px;
            padding: 35px;
            background: white;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
        }

        h1 {
            text-align: center;
            margin-bottom: 10px;
            color: #111827;
        }

        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin-bottom: 6px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 12px;
            margin-bottom: 18px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 15px;
        }

        input:focus {
            outline: none;
            border-color: #2563eb;
        }

        button {
            width: 100%;
            padding: 13px;
            border: none;
            border-radius: 8px;
            background: #2563eb;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #1d4ed8;
        }

        #message {
            margin-top: 15px;
            text-align: center;
            font-weight: bold;
        }

        .register-link {
            text-align: center;
            margin-top: 20px;
        }

        .register-link a {
            color: #2563eb;
            text-decoration: none;
        }
    </style>
</head>

<body>

    <div class="login-box">

        <h1>PROJECT-X</h1>

        <p class="subtitle">
            Login to your account
        </p>

        <form id="loginForm">

            <label for="email">
                Email
            </label>

            <input
                type="email"
                id="email"
                placeholder="Enter your email"
                required
            >

            <label for="password">
                Password
            </label>

            <input
                type="password"
                id="password"
                placeholder="Enter your password"
                required
            >

            <button type="submit">
                Login
            </button>

        </form>

        <p id="message"></p>

        <div class="register-link">
            Don't have an account?
            <a href="register.html">Register</a>
        </div>

    </div>


    <script>

        // Backend URL
        const API_URL = "http://127.0.0.1:8000";


        // Get login form
        const loginForm = document.getElementById("loginForm");


        // When user clicks Login
        loginForm.addEventListener("submit", async function(event) {

            // Stop page refresh
            event.preventDefault();


            // Get input values
            const email = document.getElementById("email").value;
            const password = document.getElementById("password").value;


            const message = document.getElementById("message");


            message.innerText = "Logging in...";
            message.style.color = "black";


            try {

                // Send login request to FastAPI
                const response = await fetch(
                    `${API_URL}/login`,
                    {
                        method: "POST",

                        headers: {
                            "Content-Type": "application/json"
                        },

                        body: JSON.stringify({
                            email: email,
                            password: password
                        })
                    }
                );


                // Convert response to JSON
                const data = await response.json();


                // Check if login failed
                if (!response.ok) {

                    message.innerText =
                        data.detail || "Login failed";

                    message.style.color = "red";

                    return;
                }


                // Login successful
                message.innerText =
                    "Login successful!";

                message.style.color = "green";


                // Save JWT token
                localStorage.setItem(
                    "access_token",
                    data.access_token
                );


                // Save user information
                localStorage.setItem(
                    "user",
                    JSON.stringify(data.user)
                );


                // Go to dashboard
                setTimeout(function() {

                    window.location.href = "dashboard.html";

                }, 1000);


            } catch (error) {

                console.error(error);

                message.innerText =
                    "Cannot connect to backend";

                message.style.color = "red";
            }

        });

    </script>

</body>
</html>
